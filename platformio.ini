; PlatformIO Project Configuration File
; Wyzwalacz PTT na ESP32-WROOM-32 — transoptor PC818 + diody LED (zielona RX, czerwona TX)
; Sterowanie z PC przez USB: emulacja CAT Icom CI-V (IC-7100), jak w "tdisplay ptt keyer"

[env:esp32-wroom]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 9600
upload_speed = 921600
board_build.flash_size = 4MB
; C++17: aggregate initialization of structs with default member values (Button in main.cpp)
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
