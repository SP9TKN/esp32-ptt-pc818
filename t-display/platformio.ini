; PlatformIO Project Configuration File
; PTT Keyer / Indicator na TTGO / LilyGO T-Display ESP32
; Display: ST7789 135x240, TFT_eSPI library
; Platforma przypięta do pioarduino 55.03.38 (Arduino ESP32 3.3.8, ESP-IDF 5.5) — na niej powstał i działa ten wariant

[env:ttgo-t-display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 19200
upload_speed = 921600
board_build.flash_size = 4MB

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    ; TFT_eSPI user setup via build flags (no User_Setup.h needed)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
